name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Identical to the local command. If they ever disagree, fixing that is priority one.
      # shellcheck and jq ship with ubuntu-latest; the claude CLI does not, so manifest
      # validation runs locally only.
      - run: scripts/check.sh
