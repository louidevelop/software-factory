# Managed by the software factory (factory sync). Do not edit — changes here arrive as a
# "factory sync" PR. The gate rates every PR low, medium or high impact, waits for the project's
# own checks, and merges PRs up to the project's `autoMerge` level (the rest once an owner adds
# the `merge` label) when `check` is green on the PR combined with the current base — it
# dispatches check.yml for that. Agents never merge or add that label. With the variable FACTORY_ROUTINE_URL and the secret
# FACTORY_ROUTINE_TOKEN set, it starts the cloud routine after a merge and when a PR starts waiting
# for an owner. On a ticket labelled `blocked` it mentions the owners, who would not be notified
# otherwise: the block is made under their own account.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  gate:
    # Same-repo branches only: a fork's PR never gets a write token. Of the labels, only the
    # owner's go-ahead starts a run.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'merge')
    # Per job, not per workflow: a run for any other label skips this job and must not cancel it.
    concurrency:
      group: factory-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: louidevelop/software-factory/classifier@main
        with:
          routine-url: ${{ vars.FACTORY_ROUTINE_URL }}
          routine-token: ${{ secrets.FACTORY_ROUTINE_TOKEN }}

  # Every pull_request run skips this job, which still shows up as a check on the PR: the gate
  # ignores it by this id (index.mjs).
  blocked-ticket:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'blocked' &&
      !github.event.issue.pull_request
    concurrency:
      group: factory-blocked-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: louidevelop/software-factory/classifier@main
